# Copy to config.yaml and fill in your credentials

spotify:
  client_id: "YOUR_SPOTIFY_CLIENT_ID"
  client_secret: "YOUR_SPOTIFY_CLIENT_SECRET"
  redirect_uri: "http://127.0.0.1:8888/callback"
  playlist_name_template: "TrackID: {set_name}"

slskd:
  base_url: "http://localhost:5030"
  # Use username/password auth (recommended)
  username: "slskd"
  password: "slskd"
  # Or use API key auth (set in slskd.yml)
  # api_key: "YOUR_SLSKD_API_KEY"

download:
  output_dir: "~/Music/TrackID Downloads"

  # ── Identity matching (Stage A) ──

  # Max duration difference before rejecting a result (seconds)
  # Graduated scoring: ±1s = high confidence, ±3s = strong, ±5s = moderate, >5s = rejected
  # Lower = stricter matching, fewer wrong versions/edits
  duration_tolerance_sec: 5

  # ── Quality ranking (Stage B) ──

  # Preferred formats in priority order (first = most preferred)
  format_priority:
    - flac
    - aiff
    - wav
    - mp3

  # For MP3, minimum acceptable bitrate (kbps)
  min_mp3_bitrate: 320

  # ── Download behavior ──

  # Cancel download if not started within this many minutes
  start_timeout_min: 5

  # Cancel if queue position is above this
  max_queue_position: 50

  # Cancel if transfer speed drops below this (KB/s)
  min_transfer_speed_kbps: 20
  speed_floor_duration_sec: 60

  # Max concurrent downloads
  max_concurrent: 3

  # Seconds between polling slskd for transfer status
  poll_interval_sec: 10

  # Max retries per track (tries different users) before giving up
  max_retries: 3
